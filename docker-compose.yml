# Local PostgreSQL for development. Same major version as Supabase (17).
#   npm run db:up      start it (data lives in the daily_meat_pgdata volume)
#   npm run db:down    stop it (data is kept; add -v to wipe it)
services:
  daily-meat-db:
    image: postgres:17
    container_name: daily-meat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_meat
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with another local Postgres on 5432
    volumes:
      - daily_meat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_meat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  daily_meat_pgdata:
