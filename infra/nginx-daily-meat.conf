# nginx site for the Daily Meat API (the API container listens on 127.0.0.1:PORT, PORT from .env; keep proxy_pass below in sync).
# Install:  sudo cp infra/nginx-daily-meat.conf /etc/nginx/sites-available/daily-meat
#           sudo ln -s /etc/nginx/sites-available/daily-meat /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d dailymeatserver.devmetsolutions.com     # adds the HTTPS server block + redirect

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name dev-dailymeatserver.devmetsolutions.com;

    client_max_body_size 20m;          # product / receipt image uploads

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # socket.io (live order updates) uses websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
